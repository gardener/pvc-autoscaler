apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "pvc-autoscaler.fullname" . }}
  labels:
    {{- include "pvc-autoscaler.labels" . | nindent 4 }}
  {{- include "pvc-autoscaler.webhookAnnotations" . | nindent 2 }}
webhooks:
  - name: vpersistentvolumeclaimautoscaler.kb.io
    admissionReviewVersions:
      - v1
    clientConfig:
      {{- include "pvc-autoscaler.webhookClientConfig" (dict "context" . "path" "/validate-autoscaling-gardener-cloud-v1alpha1-persistentvolumeclaimautoscaler") | nindent 6 }}
    failurePolicy: Fail
    sideEffects: None
    rules:
      - apiGroups:
          - autoscaling.gardener.cloud
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - persistentvolumeclaimautoscalers
