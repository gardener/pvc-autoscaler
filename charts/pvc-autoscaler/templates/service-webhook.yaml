apiVersion: v1
kind: Service
metadata:
  name: {{ include "pvc-autoscaler.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pvc-autoscaler.labels" . | nindent 4 }}
spec:
  ports:
    - name: webhook
      port: 443
      protocol: TCP
      targetPort: webhook-server
  selector:
    {{- include "pvc-autoscaler.selectorLabels" . | nindent 4 }}
