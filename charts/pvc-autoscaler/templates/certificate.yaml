{{- if .Values.webhook.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "pvc-autoscaler.certificateName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pvc-autoscaler.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ include "pvc-autoscaler.webhookServiceName" . }}.{{ .Release.Namespace }}.svc
    - {{ include "pvc-autoscaler.webhookServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ include "pvc-autoscaler.fullname" . }}-selfsigned
  secretName: {{ include "pvc-autoscaler.webhookSecretName" . }}
{{- end }}
